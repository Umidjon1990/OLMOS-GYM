[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.26.1 --activate",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm run build:railway"]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
